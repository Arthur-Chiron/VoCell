<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Nuage de noyaux</title>
<style>
  :root {
    --bg: #0e1117; --fg: #fafafa; --muted: #9aa0a6;
    --panel: rgba(22, 26, 34, 0.93); --border: rgba(250, 250, 250, 0.16);
    /* Room the host page's own chrome takes at the edges of this canvas. It
       is 10px inside the box, and whatever the toolbar and the control row
       occupy once the canvas is the whole viewport. */
    --inset-t: 10px; --inset-b: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: "Source Sans Pro", -apple-system, system-ui, sans-serif;
    color: var(--fg); background: var(--bg); }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  canvas.grabbing { cursor: grabbing; }

  .panel { position: absolute; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; backdrop-filter: blur(6px); font-size: 12px; }

  #preview { top: var(--inset-t); right: 10px; width: 208px; padding: 10px;
    display: none; }
  #preview .pair { display: flex; gap: 6px; }
  #preview .cell { flex: 1; }
  #preview canvas { width: 91px; height: 91px; image-rendering: pixelated;
    border-radius: 4px; background: #000; cursor: default; display: block; }
  #preview .cap { color: var(--muted); font-size: 10px; margin-top: 3px;
    text-align: center; }
  #preview .idx { margin-top: 8px; font-weight: 600; font-size: 13px; }
  #preview .meta { color: var(--muted); margin-top: 2px; line-height: 1.45; }
  #preview .hint { color: var(--muted); margin-top: 6px; font-size: 11px;
    border-top: 1px solid var(--border); padding-top: 6px; }

  #legend { bottom: var(--inset-b); left: 10px; padding: 6px 0; width: 246px;
    display: flex; flex-direction: column;
    max-height: calc(100% - var(--inset-t) - var(--inset-b) - 60px);
    opacity: 0.45; transition: opacity 0.12s ease; }
  #legend:hover, #legend.open { opacity: 1; }
  #legend.shut #legendRows { display: none; }
  #legend.shut { padding-bottom: 2px; }
  #legend .hdr { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 0 10px; display: flex;
    align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  #legend:not(.shut) .hdr { padding-bottom: 6px; }
  #legend .hdr .tw { font-size: 9px; width: 11px; text-align: center; }
  #legend .hdr .grow { flex: 1; }
  #legend .hdr button { background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 5px; padding: 2px 6px; cursor: pointer;
    font-size: 10px; font-family: inherit; text-transform: none; letter-spacing: 0; }
  #legend .hdr button.on { color: var(--fg); border-color: rgba(250,250,250,0.45); }
  #legendRows { overflow-y: auto; padding: 0 10px; }

  .ds { display: flex; align-items: center; gap: 6px; padding: 3px 0;
    cursor: pointer; user-select: none; font-weight: 600; }
  .ds.off { opacity: 0.3; }
  .ds.partial .dot { box-shadow: inset 0 0 0 1.5px var(--bg); }
  .caret { width: 11px; flex: 0 0 11px; color: var(--muted); font-size: 9px;
    text-align: center; }
  .caret.leaf { visibility: hidden; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 400; padding-left: 6px; }
  .cls { display: flex; align-items: center; gap: 6px; padding: 1px 0 1px 17px;
    cursor: pointer; user-select: none; }
  .cls.off { opacity: 0.3; }
  .grp { margin-bottom: 1px; }

  #status { left: 10px; top: var(--inset-t); padding: 5px 9px; color: var(--muted);
    display: flex; gap: 10px; align-items: center; opacity: 0.55;
    transition: opacity 0.12s ease; }
  #status:hover { opacity: 1; }
  #status button { background: transparent; border: 1px solid var(--border);
    color: var(--fg); border-radius: 5px; padding: 3px 8px; cursor: pointer;
    font-size: 11px; font-family: inherit; }
  #status button:hover { background: rgba(250, 250, 250, 0.08); }

  #axes { right: 10px; bottom: var(--inset-b); padding: 6px 9px; color: var(--muted);
    text-align: right; line-height: 1.5; max-width: 46%; opacity: 0.55;
    transition: opacity 0.12s ease; }
  #axes:hover { opacity: 1; }
  #axes span { color: var(--fg); }

  #loading { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="loading">Chargement du nuage…</div>

  <div class="panel" id="preview">
    <div class="pair">
      <div class="cell"><canvas id="pv" width="32" height="32"></canvas>
        <div class="cap">noyau</div></div>
      <div class="cell"><canvas id="pvm" width="32" height="32"></canvas>
        <div class="cap" id="pvmCap">masque</div></div>
    </div>
    <div class="idx" id="pvIdx"></div>
    <div class="meta" id="pvMeta"></div>
    <div class="hint">Cliquer pour ouvrir dans l'explorateur 3D</div>
  </div>

  <div class="panel shut" id="legend">
    <div class="hdr" id="legendHdr">
      <span class="tw" id="legendTw">▸</span>
      <span class="grow">Sources</span>
      <button id="btDs" class="on">dataset</button>
      <button id="btCl">classe</button>
    </div>
    <div id="legendRows"></div>
  </div>

  <div class="panel" id="status">
    <button id="btReset">Vue d'ensemble</button>
  </div>

  <div class="panel" id="axes">
    <div>x — <span id="axX"></span></div>
    <div>y — <span id="axY"></span></div>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Streamlit custom-component protocol (hand-rolled: this component has
 * no build step, so it speaks the postMessage protocol directly).
 * ------------------------------------------------------------------ */
function send(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra), "*");
}
const setValue = (value) => send("streamlit:setComponentValue", { value, dataType: "json" });

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ *
 * Everything per-nucleus is fetched over HTTP from this component's own
 * directory, never pushed through component args: at 2.6 M points a
 * position pair is 10 MB, which would cross the websocket every time an
 * axis changes. Python sends two column names; the browser fetches and
 * caches the columns.
 */
const S = {
  N: 0, x: null, y: null,           // Float32Array positions, elliptic layout
  rawx: null, rawy: null,           // the same columns before the mapping
  cls: null,                        // Uint8Array global class id
  meta: null, v: "",
  datasets: [], classOf: [],        // classOf[id] = {dataset, name, color}
  hidden: new Set(),                // hidden class ids
  colorBy: "dataset",
  colors: null,                     // Uint32Array per class id, packed RGBA
  cols: new Map(),                  // column key -> Float32Array
  atlasCache: new Map(), maskCache: new Map(),
  grid: null,
  view: { cx: 0.5, cy: 0.5, k: 1 },
  hover: -1, clicks: 0, ready: false, dpr: 1,
  marked: -1, markedColour: "#fafafa",   // pointed at from the header
  keys: { x: null, y: null }, jitter: null,
};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d", { alpha: false });
const pv = document.getElementById("pv");
const pvCtx = pv.getContext("2d");
const pvm = document.getElementById("pvm");
const pvmCtx = pvm.getContext("2d");
let imgData = null, imgBuf = null;

const fmt = (n) => n.toLocaleString("fr-FR");

/* ------------------------------------------------------------------ *
 * Static assets
 * ------------------------------------------------------------------ */
async function loadMeta() {
  const meta = await (await fetch("meta.json", { cache: "no-store" })).json();
  S.meta = meta;
  S.v = "?v=" + (meta.build || 0);
  S.N = meta.count;
  S.datasets = meta.datasets;
  S.cls = new Uint8Array(await (await fetch("classes.bin" + S.v)).arrayBuffer());

  S.classOf = [];
  for (const d of meta.datasets) {
    for (const c of d.classes) S.classOf[c.id] = { dataset: d, ...c };
  }
  rebuildColors();
  buildLegend();
}

/* Columns are uint16 on the wire and Float32 in memory: 1/65535 of the unit
   square is far below anything the canvas can resolve, even zoomed all the
   way in, and halves what crosses the network. */
async function column(key) {
  // The jittered and raw forms of a column are cached separately: toggling
  // the setting must not silently keep the other one.
  const slot = key + (S.jitter ? "|j" : "");
  let col = S.cols.get(slot);
  if (col) return col;
  const buf = await (await fetch("cols/" + key + ".bin" + S.v)).arrayBuffer();
  const q = new Uint16Array(buf);
  col = new Float32Array(q.length);
  const step = S.jitter ? (S.meta.jitter[key] || 0) : 0;
  for (let i = 0; i < q.length; i++) {
    let v = q[i] / 65535;
    if (step) v += (hash01(i, key.length) - 0.5) * 0.8 * step;
    col[i] = v < 0 ? 0 : v > 1 ? 1 : v;
  }
  S.cols.set(slot, col);
  return col;
}

/* Deterministic per-point offset for a quantised axis: `area` is a pixel
   count, so hundreds of thousands of nuclei land on the same coordinate and
   the cloud turns into stripes. Seeded on the index so it never moves
   between frames, and kept under half the spacing between two levels so no
   point crosses into a neighbour's column. */
function hash01(i, salt) {
  let h = (i ^ (salt * 0x9e3779b1)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function sheetPath(kind, k) {
  const shard = String(Math.floor(k / S.meta.shard)).padStart(3, "0");
  const name = kind === "masks" ? "mask" : "atlas";
  return kind + "/" + shard + "/" + name + "_" + String(k).padStart(6, "0")
         + ".png" + S.v;
}

const ATLAS_CACHE_MAX = 900;

/* Masks live in their own sheets rather than in the thumbnails' alpha: the
   zoomed mosaic never needs them, and the preview needs exactly one, which
   weighs ~3 kB. */
function sheetImage(kind, k) {
  const cache = kind === "masks" ? S.maskCache : S.atlasCache;
  let img = cache.get(k);
  if (img) { cache.delete(k); cache.set(k, img); return img; }
  if (cache.size >= ATLAS_CACHE_MAX) {
    // Map preserves insertion order, so the first key is the least recently used.
    cache.delete(cache.keys().next().value);
  }
  img = new Image();
  img.decoding = "async";
  // The preview is painted the moment the pointer lands on a point, which is
  // usually before that point's sheet has arrived. Repaint on load.
  img.onload = () => {
    if (kind !== "masks") draw();
    // Whichever of the two is asking: the pointer on a point here, or the
    // header pointing at one of its letters.
    const want = S.hover >= 0 ? S.hover : S.marked;
    if (want >= 0) showPreview(want);
  };
  img.src = sheetPath(kind, k);
  cache.set(k, img);
  return img;
}

const atlasImage = (k) => sheetImage("atlas", k);

function thumbLoc(i) {
  const m = S.meta, slot = i % m.per_atlas;
  return {
    sheet: (i / m.per_atlas) | 0,
    sx: (slot % m.per_row) * m.thumb,
    sy: (((slot / m.per_row) | 0)) * m.thumb,
  };
}

/* Datasets occupy contiguous ranges of the global index, so a point's source
   is a binary search rather than another per-point array. */
function globalIndex(name, local) {
  const d = S.datasets.find((d) => d.name === name);
  return d ? d.start + local : -1;
}

function datasetOf(i) {
  let lo = 0, hi = S.datasets.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (S.datasets[mid].start <= i) lo = mid; else hi = mid - 1;
  }
  return S.datasets[lo];
}

/* ------------------------------------------------------------------ *
 * Colours
 * ------------------------------------------------------------------ */
function pack(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
  return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;   // little-endian RGBA
}

function rebuildColors() {
  S.colors = new Uint32Array(256);
  for (const d of S.datasets) {
    for (const c of d.classes) {
      S.colors[c.id] = pack(S.colorBy === "classe" ? c.color : d.color);
    }
  }
}

/* ------------------------------------------------------------------ *
 * Spatial grid: hover picking and viewport culling both need to go from
 * a screen region to the points inside it without touching all 2.6 M
 * every frame. Counting sort, rebuilt whenever a column changes.
 * ------------------------------------------------------------------ */
function buildGrid() {
  const N = S.N, X = S.x, Y = S.y;
  const cols = Math.max(1, Math.min(1024, Math.ceil(Math.sqrt(N / 4))));
  const counts = new Int32Array(cols * cols + 1);
  const cell = new Int32Array(N);
  for (let i = 0; i < N; i++) {
    let gx = (X[i] * cols) | 0, gy = (Y[i] * cols) | 0;
    if (gx >= cols) gx = cols - 1; if (gx < 0) gx = 0;
    if (gy >= cols) gy = cols - 1; if (gy < 0) gy = 0;
    const c = gy * cols + gx;
    cell[i] = c; counts[c + 1]++;
  }
  for (let c = 0; c < cols * cols; c++) counts[c + 1] += counts[c];
  const starts = counts.slice();
  const order = new Int32Array(N);
  const cursor = counts.slice(0, cols * cols);
  for (let i = 0; i < N; i++) order[cursor[cell[i]]++] = i;
  S.grid = { cols, starts, order };
}

/* ------------------------------------------------------------------ *
 * Elliptic layout
 * ------------------------------------------------------------------ *
 * The two columns are each normalised to [0,1], so on their own they fill a
 * square -- and a square of 2.6 M points reads as a poster, not as a cloud.
 * The elliptical grid mapping (Fong 2014) sends the unit square onto the
 * unit disc, which is then stretched to ASPECT to fill a wide pane:
 *
 *     u' = u * sqrt(1 - v^2 / 2),   v' = v * sqrt(1 - u^2 / 2)
 *
 * It is a bijection, continuous, and it moves the interior far less than the
 * corners -- the amas keep their relative places, the four corners stop
 * pretending to be data. It IS a distortion of the axes: the readout in the
 * preview therefore quotes the raw column values, never these.
 */
const ASPECT = 1.7;                       // ellipse width / height
const DATA = { hx: 0.5, hy: 0.5 / ASPECT };   // half-extents around (0.5, 0.5)

function ellipsify(cx, cy) {
  const n = cx.length;
  const X = new Float32Array(n), Y = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const u = cx[i] * 2 - 1, v = cy[i] * 2 - 1;
    X[i] = 0.5 + u * Math.sqrt(1 - v * v / 2) * DATA.hx;
    Y[i] = 0.5 + v * Math.sqrt(1 - u * u / 2) * DATA.hy;
  }
  return [X, Y];
}

/* ------------------------------------------------------------------ *
 * View transform. Data lives in [0,1]^2; y is flipped so "up" on screen
 * means a larger descriptor value.
 * ------------------------------------------------------------------ */
const W = () => cv.clientWidth, H = () => cv.clientHeight;
const toScreenX = (x) => (x - S.view.cx) * S.view.k + W() / 2;
const toScreenY = (y) => H() / 2 - (y - S.view.cy) * S.view.k;
const toDataX = (px) => (px - W() / 2) / S.view.k + S.view.cx;
const toDataY = (py) => (H() / 2 - py) / S.view.k + S.view.cy;

/* The zoom that just fits the whole ellipse, margin included. It is also the
   floor: zooming out past it would leave the cloud floating in a void, and
   the same floor is what keeps panning from pushing it off screen. */
function fitK() {
  return Math.min(W() / (2 * DATA.hx), H() / (2 * DATA.hy)) * 0.94;
}

/* Pan and zoom are contained: below fitK the view snaps back to it, and on
   each axis the centre is either locked (the whole extent is visible) or
   kept inside the data, so no drag can send the cloud out of the pane. */
function clampView() {
  const kmin = fitK();
  if (!(S.view.k >= kmin)) S.view.k = kmin;
  const halfW = W() / (2 * S.view.k), halfH = H() / (2 * S.view.k);
  S.view.cx = halfW >= DATA.hx ? 0.5
    : Math.min(Math.max(S.view.cx, 0.5 - DATA.hx + halfW), 0.5 + DATA.hx - halfW);
  S.view.cy = halfH >= DATA.hy ? 0.5
    : Math.min(Math.max(S.view.cy, 0.5 - DATA.hy + halfH), 0.5 + DATA.hy - halfH);
}

function resetView() {
  S.view.k = fitK();
  S.view.cx = 0.5; S.view.cy = 0.5;
  invalidate(); draw(false);
}

/* ------------------------------------------------------------------ *
 * The host's chrome
 * ------------------------------------------------------------------ *
 * This canvas is the page: the host pins it to the viewport and floats the
 * wordmark, Streamlit's toolbar and the control row over it. Nothing here
 * switches that on -- it is the layout, in `_CLOUD_CSS`. What this does need
 * is to keep its own overlays out from under that chrome, and it takes the
 * room from what the host page actually measures rather than from a copy of
 * the host's constants kept here.
 */
function hostDoc() {
  try { return window.parent.document; } catch (e) { return null; }
}

function syncInsets() {
  let top = 10, bottom = 10;
  const doc = hostDoc();
  if (doc) {
    const head = doc.querySelector('header[data-testid="stHeader"]');
    const bar = doc.querySelector(".st-key-cloud_controls");
    if (head) top = Math.max(top, Math.round(head.getBoundingClientRect().bottom) + 10);
    if (bar) bottom = Math.max(bottom,
      Math.round(window.innerHeight - bar.getBoundingClientRect().top) + 12);
  }
  const st = document.documentElement.style;
  st.setProperty("--inset-t", top + "px");
  st.setProperty("--inset-b", bottom + "px");
}

function resize() {
  S.dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(W() * S.dpr)), h = Math.max(1, Math.round(H() * S.dpr));
  if (cv.width !== w || cv.height !== h) {
    cv.width = w; cv.height = h;
    imgData = ctx.createImageData(w, h);
    imgBuf = new Uint32Array(imgData.data.buffer);
    pointsDirty = true;
  }
}

function cellRange() {
  const g = S.grid;
  const x0 = toDataX(0), x1 = toDataX(W());
  const y1 = toDataY(0), y0 = toDataY(H());
  return {
    x0, x1, y0, y1,
    cx0: Math.max(0, Math.floor(x0 * g.cols)), cx1: Math.min(g.cols - 1, Math.ceil(x1 * g.cols)),
    cy0: Math.max(0, Math.floor(y0 * g.cols)), cy1: Math.min(g.cols - 1, Math.ceil(y1 * g.cols)),
  };
}

const THUMB_THRESHOLD = 600;   // above this, thumbnails are unreadable and costly
const FAST_BUDGET = 350000;    // points drawn per frame while panning or zooming

let idleTimer = null;

// Painting 2.6 M points costs ~180 ms, and moving the pointer one nucleus to
// the left changes nothing but a 6 px ring. The point layer is therefore
// rendered into its ImageData only when something it depends on moves -- the
// view, the columns, the filters, the canvas size -- and a hover just blits
// it back and strokes the ring on top.
let pointsDirty = true;
let lastFrame = { count: 0, stride: 1, thumbs: false, R: null };

const invalidate = () => { pointsDirty = true; };

/* ------------------------------------------------------------------ *
 * Pointed at from the header
 * ------------------------------------------------------------------ *
 * The six letters of the wordmark are six of these points. Hovering one up
 * there marks it down here, over a BroadcastChannel between the two iframes
 * -- same origin, no Python in the loop, so it keeps up with the mouse.
 */
function drawMarker() {
  const w = W(), h = H(), m = 18;
  const x = toScreenX(S.x[S.marked]), y = toScreenY(S.y[S.marked]);
  const cx = Math.min(Math.max(x, m), w - m);
  const cy = Math.min(Math.max(y, m), h - m);
  const off = cx !== x || cy !== y;

  const path = () => {
    ctx.beginPath();
    ctx.arc(cx, cy, 8.5, 0, Math.PI * 2);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      ctx.moveTo(cx + dx * 12, cy + dy * 12);
      ctx.lineTo(cx + dx * 18, cy + dy * 18);
    }
    if (off) {
      // Clamped to the edge, because the view is zoomed elsewhere: point the
      // way the nucleus actually lies rather than lying about where it is.
      const a = Math.atan2(y - cy, x - cx);
      ctx.moveTo(cx + Math.cos(a) * 20, cy + Math.sin(a) * 20);
      ctx.lineTo(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30);
    }
  };

  ctx.save();
  ctx.scale(S.dpr, S.dpr);
  ctx.lineCap = "round";
  // Struck twice: over two million points a thin ring in any single colour
  // lands on a field that already contains it.
  ctx.strokeStyle = "rgba(0, 0, 0, 0.85)"; ctx.lineWidth = 4.5;
  path(); ctx.stroke();
  ctx.strokeStyle = S.markedColour; ctx.lineWidth = 2;
  path(); ctx.stroke();
  ctx.restore();
}

let channel = null;
try { channel = new BroadcastChannel("vocell"); } catch (e) { channel = null; }
if (channel) channel.onmessage = (e) => {
  const m = e.data;
  if (!m || m.type !== "vocell:letter-hover" || !S.ready) return;
  const g = m.dataset == null ? -1 : globalIndex(m.dataset, m.index);
  if (g === S.marked) return;
  S.marked = g;
  S.markedColour = m.colour || "#fafafa";
  // The same panel the pointer fills, with the same fields: a nucleus is
  // shown in one place in this app, and the header borrows it rather than
  // keeping a second, slightly different copy of it.
  showPreview(g);
  draw(false);
};


function draw(fast) {
  if (!S.ready) return;
  resize();
  if (pointsDirty) {
    renderPoints(!!fast);
    pointsDirty = !!fast;          // a strided frame stays dirty for the idle pass
  }
  ctx.putImageData(imgData, 0, 0);

  const f = lastFrame;
  if (f.thumbs) drawThumbs(f.R, S.dpr, f.count);
  else if (S.hover >= 0) {
    ctx.save(); ctx.scale(S.dpr, S.dpr);
    ctx.beginPath();
    ctx.arc(toScreenX(S.x[S.hover]), toScreenY(S.y[S.hover]), 6, 0, Math.PI * 2);
    ctx.strokeStyle = "#fafafa"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  if (S.marked >= 0 && S.marked < S.N) drawMarker();
}

function renderPoints(fast) {
  const w = cv.width, h = cv.height, dpr = S.dpr, g = S.grid;
  const X = S.x, Y = S.y, cls = S.cls, colors = S.colors, hidden = S.hidden;
  imgBuf.fill((255 << 24) | (0x17 << 16) | (0x11 << 8) | 0x0e);

  const R = cellRange();
  // While dragging, stride the point list so a frame stays under budget; the full
  // cloud is redrawn as soon as the pointer stops.
  let stride = 1;
  if (fast) {
    let approx = 0;
    for (let gy = R.cy0; gy <= R.cy1; gy++) {
      const base = gy * g.cols;
      approx += g.starts[base + R.cx1 + 1] - g.starts[base + R.cx0];
    }
    stride = Math.max(1, Math.ceil(approx / FAST_BUDGET));
  }

  const kx = S.view.k, W2 = W() / 2, H2 = H() / 2, cx = S.view.cx, cy = S.view.cy;
  const rad = kx > 3000 ? 2 : 1;
  let count = 0;

  for (let gy = R.cy0; gy <= R.cy1; gy++) {
    const base = gy * g.cols;
    for (let gx = R.cx0; gx <= R.cx1; gx++) {
      const c = base + gx, end = g.starts[c + 1];
      for (let p = g.starts[c]; p < end; p += stride) {
        const i = g.order[p];
        if (hidden.has(cls[i])) continue;
        const dx = X[i], dy = Y[i];
        if (dx < R.x0 || dx > R.x1 || dy < R.y0 || dy > R.y1) continue;
        count++;
        const px = ((dx - cx) * kx + W2) * dpr | 0;
        const py = (H2 - (dy - cy) * kx) * dpr | 0;
        const col = colors[cls[i]];
        for (let oy = -rad; oy <= rad; oy++) {
          const yy = py + oy;
          if (yy < 0 || yy >= h) continue;
          const row = yy * w;
          for (let ox = -rad; ox <= rad; ox++) {
            const xx = px + ox;
            if (xx >= 0 && xx < w) imgBuf[row + xx] = col;
          }
        }
      }
    }
  }
  lastFrame = { count, stride, R,
                thumbs: stride === 1 && count > 0 && count <= THUMB_THRESHOLD };
}

/* Zoomed in far enough that each point has room: swap the dots for the
   actual nuclei. This is the payoff of the whole atlas machinery. */
function drawThumbs(R, dpr, count) {
  const g = S.grid, X = S.x, Y = S.y;
  const size = Math.max(14, Math.min(72,
    Math.sqrt((W() * H()) / Math.max(count, 1)) * 0.78));
  ctx.save(); ctx.scale(dpr, dpr); ctx.imageSmoothingEnabled = false;
  for (let gy = R.cy0; gy <= R.cy1; gy++) {
    for (let gx = R.cx0; gx <= R.cx1; gx++) {
      const c = gy * g.cols + gx, end = g.starts[c + 1];
      for (let p = g.starts[c]; p < end; p++) {
        const i = g.order[p];
        if (S.hidden.has(S.cls[i])) continue;
        if (X[i] < R.x0 || X[i] > R.x1 || Y[i] < R.y0 || Y[i] > R.y1) continue;
        const loc = thumbLoc(i), img = atlasImage(loc.sheet);
        const sx = toScreenX(X[i]) - size / 2, sy = toScreenY(Y[i]) - size / 2;
        if (img.complete && img.naturalWidth) {
          ctx.drawImage(img, loc.sx, loc.sy, S.meta.thumb, S.meta.thumb,
                        sx, sy, size, size);
        }
        ctx.strokeStyle = classColor(S.cls[i]);
        ctx.lineWidth = i === S.hover ? 2.5 : 1;
        ctx.globalAlpha = i === S.hover ? 1 : 0.55;
        ctx.strokeRect(sx, sy, size, size);
        ctx.globalAlpha = 1;
      }
    }
  }
  ctx.restore();
}

function classColor(id) {
  const c = S.classOf[id];
  return !c ? "#888" : (S.colorBy === "classe" ? c.color : c.dataset.color);
}

function scheduleFull() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => draw(false), 140);
}

/* ------------------------------------------------------------------ *
 * Hover picking
 * ------------------------------------------------------------------ */
function pick(mx, my) {
  const g = S.grid, X = S.x, Y = S.y;
  let best = -1, bestD = Infinity;
  const reach = 14 / S.view.k;                       // 14 CSS px, in data units
  const dx0 = toDataX(mx), dy0 = toDataY(my);
  const c0 = Math.max(0, Math.floor((dx0 - reach) * g.cols));
  const c1 = Math.min(g.cols - 1, Math.ceil((dx0 + reach) * g.cols));
  const r0 = Math.max(0, Math.floor((dy0 - reach) * g.cols));
  const r1 = Math.min(g.cols - 1, Math.ceil((dy0 + reach) * g.cols));
  for (let gy = r0; gy <= r1; gy++) {
    for (let gx = c0; gx <= c1; gx++) {
      const c = gy * g.cols + gx, end = g.starts[c + 1];
      for (let p = g.starts[c]; p < end; p++) {
        const i = g.order[p];
        if (S.hidden.has(S.cls[i])) continue;
        const ddx = X[i] - dx0, ddy = Y[i] - dy0;
        const d = ddx * ddx + ddy * ddy;
        if (d < bestD) { bestD = d; best = i; }
      }
    }
  }
  return bestD <= reach * reach ? best : -1;
}

function nucleusInfo(i) {
  const d = datasetOf(i), c = S.classOf[S.cls[i]];
  return { dataset: d.name, local: i - d.start, note: d.note,
           cls: c ? c.name : "", labeled: d.labeled, support: d.support };
}

function blit(ctx2, img, loc) {
  const t = S.meta.thumb;
  ctx2.imageSmoothingEnabled = false;
  ctx2.fillStyle = "#000";
  ctx2.fillRect(0, 0, t, t);
  if (img.complete && img.naturalWidth) {
    ctx2.drawImage(img, loc.sx, loc.sy, t, t, 0, 0, t, t);
  }
}

function showPreview(i) {
  const box = document.getElementById("preview");
  if (i < 0) { box.style.display = "none"; return; }
  const info = nucleusInfo(i), loc = thumbLoc(i);
  blit(pvCtx, sheetImage("atlas", loc.sheet), loc);
  blit(pvmCtx, sheetImage("masks", loc.sheet), loc);
  // HPA never went through a segmentation mask: its zero background is an
  // intensity threshold, so what is drawn there is a support, not a mask.
  document.getElementById("pvmCap").textContent =
    info.support === "seuil" ? "support (seuil)" : "masque";
  document.getElementById("pvIdx").textContent = info.dataset + " #" + fmt(info.local);
  document.getElementById("pvMeta").innerHTML =
    (info.labeled ? info.cls + "<br>" : "") +
    // The raw columns, not the elliptic positions: the mapping is a layout,
    // and quoting its output as a coordinate would be a lie.
    "x&nbsp;" + S.rawx[i].toFixed(3) + " · y&nbsp;" + S.rawy[i].toFixed(3);
  box.style.display = "block";
}

/* ------------------------------------------------------------------ *
 * Legend: datasets as super-classes. Clicking a dataset hides all of it
 * at once; labelled ones unfold into their classes.
 * ------------------------------------------------------------------ */
const expanded = new Set();

function buildLegend() {
  const host = document.getElementById("legendRows");
  host.innerHTML = "";
  for (const d of S.datasets) {
    const grp = document.createElement("div");
    grp.className = "grp";

    const row = document.createElement("div");
    row.className = "ds";
    row.dataset.ds = d.name;
    const total = d.classes.reduce((a, c) => a + c.count, 0);
    row.innerHTML =
      '<span class="caret' + (d.labeled ? '' : ' leaf') + '">' +
      (d.labeled ? '▸' : '') + '</span>' +
      '<span class="dot" style="background:' + d.color + '"></span>' +
      '<span class="nm">' + d.name + '</span>' +
      '<span class="n">' + fmt(total) + '</span>';
    row.title = d.note || d.name;

    row.addEventListener("click", (e) => {
      if (d.labeled && e.target.classList.contains("caret")) {
        if (expanded.has(d.name)) expanded.delete(d.name); else expanded.add(d.name);
        buildLegend();
        return;
      }
      const anyShown = d.classes.some((c) => !S.hidden.has(c.id));
      for (const c of d.classes) {
        if (anyShown) S.hidden.add(c.id); else S.hidden.delete(c.id);
      }
      afterToggle();
    });
    grp.appendChild(row);

    if (d.labeled && expanded.has(d.name)) {
      row.querySelector(".caret").textContent = "▾";
      for (const c of d.classes) {
        const cr = document.createElement("div");
        cr.className = "cls" + (S.hidden.has(c.id) ? " off" : "");
        cr.innerHTML =
          '<span class="dot" style="background:' +
          (S.colorBy === "classe" ? c.color : d.color) + '"></span>' +
          '<span class="nm">' + c.name + '</span>' +
          '<span class="n">' + fmt(c.count) + '</span>';
        cr.addEventListener("click", () => {
          if (S.hidden.has(c.id)) S.hidden.delete(c.id); else S.hidden.add(c.id);
          afterToggle();
        });
        grp.appendChild(cr);
      }
    }

    const hiddenCount = d.classes.filter((c) => S.hidden.has(c.id)).length;
    if (hiddenCount === d.classes.length) row.classList.add("off");
    else if (hiddenCount > 0) row.classList.add("partial");

    host.appendChild(grp);
  }
}

function afterToggle() {
  buildLegend();
  S.hover = -1; showPreview(-1); invalidate(); draw(false);
}

const legendBox = document.getElementById("legend");
document.getElementById("legendHdr").addEventListener("click", (e) => {
  // The colour buttons live in the same header; they must not fold it.
  if (e.target.tagName === "BUTTON") return;
  const shut = legendBox.classList.toggle("shut");
  legendBox.classList.toggle("open", !shut);
  document.getElementById("legendTw").textContent = shut ? "▸" : "▾";
});

document.getElementById("btDs").addEventListener("click", () => setColorBy("dataset"));
document.getElementById("btCl").addEventListener("click", () => setColorBy("classe"));

function setColorBy(mode) {
  S.colorBy = mode;
  document.getElementById("btDs").classList.toggle("on", mode === "dataset");
  document.getElementById("btCl").classList.toggle("on", mode === "classe");
  rebuildColors(); buildLegend(); invalidate(); draw(false);
}

/* ------------------------------------------------------------------ *
 * Interaction
 * ------------------------------------------------------------------ */
let dragging = false, dragMoved = false, lastX = 0, lastY = 0;

cv.addEventListener("mousemove", (e) => {
  if (!S.ready) return;
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (dragging) {
    const ddx = e.clientX - lastX, ddy = e.clientY - lastY;
    if (Math.abs(ddx) + Math.abs(ddy) > 2) dragMoved = true;
    S.view.cx -= ddx / S.view.k;
    S.view.cy += ddy / S.view.k;
    clampView();
    lastX = e.clientX; lastY = e.clientY;
    invalidate(); draw(true); scheduleFull();
    return;
  }
  const hit = pick(mx, my);
  if (hit !== S.hover) { S.hover = hit; showPreview(hit); draw(false); }
});

cv.addEventListener("mouseleave", () => { S.hover = -1; showPreview(-1); draw(false); });
cv.addEventListener("mousedown", (e) => {
  dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY;
  cv.classList.add("grabbing");
});
window.addEventListener("mouseup", () => { dragging = false; cv.classList.remove("grabbing"); });

cv.addEventListener("click", (e) => {
  if (dragMoved || !S.ready) return;
  const r = cv.getBoundingClientRect();
  const hit = pick(e.clientX - r.left, e.clientY - r.top);
  if (hit < 0) return;
  const info = nucleusInfo(hit);
  S.clicks++;
  // The nonce is what tells Python "this is a new click", since the payload
  // for the same nucleus is identical. A plain counter would restart at 1
  // whenever the iframe remounts -- which is exactly what going back to the
  // cloud does -- and the first click after a return would look like a
  // replay of the last one. A wall-clock stamp never repeats across mounts.
  setValue({ dataset: info.dataset, index: info.local, global: hit,
             nonce: Date.now() + "-" + S.clicks });
});

cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (!S.ready) return;
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const ax = toDataX(mx), ay = toDataY(my);
  const factor = Math.exp(-e.deltaY * 0.0016);
  S.view.k = Math.max(fitK(), Math.min(4e6, S.view.k * factor));
  S.view.cx = ax - (mx - W() / 2) / S.view.k;   // keep the cursor's point pinned
  S.view.cy = ay + (my - H() / 2) / S.view.k;
  clampView();
  invalidate(); draw(true); scheduleFull();
  S.hover = pick(mx, my); showPreview(S.hover);
}, { passive: false });

document.getElementById("btReset").addEventListener("click", resetView);

/* ------------------------------------------------------------------ *
 * Render entry point
 * ------------------------------------------------------------------ */
let metaReady = null;
let pending = 0;

async function onRender(args) {
  // Streamlit can deliver a second render before the first has finished
  // loading. Guarding with a boolean lets that second call run on with the
  // state still null; awaiting the same promise does not.
  if (!metaReady) metaReady = loadMeta();
  await metaReady;

  // The frame height is a fallback only: the page pins this iframe to the
  // viewport in CSS, and `html, body { height: 100% }` follows it. Setting
  // body's height in pixels here would fight that and desync the canvas.
  send("streamlit:setFrameHeight", { height: args.height || 640 });

  const jitter = args.jitter !== false;
  const xk = args.x, yk = args.y;
  if (S.keys.x === xk && S.keys.y === yk && S.jitter === jitter && S.ready) return;
  S.jitter = jitter;

  const token = ++pending;
  const [cx, cy] = await Promise.all([column(xk), column(yk)]);
  if (token !== pending) return;            // a newer axis change won the race

  const first = !S.ready;
  S.keys = { x: xk, y: yk };
  S.rawx = cx; S.rawy = cy;
  [S.x, S.y] = ellipsify(cx, cy);
  buildGrid();

  const lab = S.meta.axes[xk] || S.meta.labels[xk] || xk;
  const lab2 = S.meta.axes[yk] || S.meta.labels[yk] || yk;
  document.getElementById("axX").textContent = lab;
  document.getElementById("axY").textContent = lab2;
  document.getElementById("loading").style.display = "none";

  S.ready = true;
  syncInsets();
  invalidate();
  if (first) resetView(); else draw(false);
}

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") onRender(e.data.args);
});
window.addEventListener("resize", () => {
  resize();
  if (S.ready) { clampView(); invalidate(); }
  syncInsets();
  draw(false);
});


send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
